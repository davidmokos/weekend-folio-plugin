<!doctype html>
<!-- The source of the pictures in this repository. scripts/render-assets.sh
     opens this page once for each picture, with its id as the URL hash, and
     saves a screenshot:

       #banner     assets/banner.png                         1280 x 640
       #logo       plugins/weekend-folio/assets/logo.png      512 x 512
       #logo-dark  plugins/weekend-folio/assets/logo-dark.png 512 x 512

     The look is the Weekend Folio poster: warm grey paper, Newsreader for the
     words, Hanken Grotesk for the small capitals, square corners. -->
<meta charset="utf-8" />
<title>Weekend Folio plugin: brand pictures</title>
<link
  href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Hanken+Grotesk:wght@700&display=block"
  rel="stylesheet"
/>
<style>
  html, body { margin: 0; }
  body { background: #999; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
  p { margin: 0; }

  /* With a hash, the page shows that one picture only, at the top left. */
  body.one { padding: 0; background: none; display: block; }
  body.one > :not(.shown) { display: none; }

  /* The banner at the top of the README. */
  #banner { position: relative; width: 1280px; height: 640px; background: #e9e7e1; color: #161614; overflow: hidden; }
  #banner .rail {
    position: absolute; left: 48px; right: 48px; top: 38px;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    font: 700 15px/1.3 "Hanken Grotesk", sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
  }
  #banner .rail span:nth-child(2) { text-align: center; }
  #banner .rail span:last-child { text-align: right; }
  #banner .word {
    position: absolute; left: 37px; top: 108px;
    font: 500 200px/0.8 Newsreader, serif; font-variation-settings: "opsz" 72;
    letter-spacing: -0.045em; white-space: nowrap;
  }
  #banner .plate {
    position: absolute; left: 48px; right: 48px; top: 306px; bottom: 0;
    background: #d9d6ce; display: flex; align-items: flex-end; gap: 30px; padding: 0 48px;
  }
  #banner .say { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; padding: 44px 0 38px; width: 500px; }
  #banner .line { font: 500 46px/0.98 Newsreader, serif; font-variation-settings: "opsz" 72; letter-spacing: -0.032em; }
  #banner .address { font: 700 15px/1.3 "Hanken Grotesk", sans-serif; letter-spacing: 0.04em; }
  #banner img { width: 184px; margin-bottom: -36px; box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.3), 0 18px 28px -14px rgb(0 0 0 / 0.4); }
  #banner img:first-of-type { margin-left: auto; }

  /* The mark: a lowercase serif w. Paper on black, and black on paper for dark surfaces. */
  .mark { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; }
  .mark span { font: 500 440px/1 Newsreader, serif; font-variation-settings: "opsz" 72; letter-spacing: -0.02em; transform: translateY(12px); }
  #logo { background: #161614; color: #e9e7e1; }
  #logo-dark { background: #e9e7e1; color: #161614; }
</style>

<div id="banner">
  <p class="rail">
    <span>A plugin for AI assistants</span>
    <span>Save links in any conversation</span>
    <span>PDF, Kindle or print</span>
  </p>
  <p class="word">weekend folio</p>
  <div class="plate">
    <div class="say">
      <p class="line">Tell your assistant<br />what you meant<br />to read.</p>
      <p class="address">weekendfolio.com/mcp</p>
    </div>
    <!-- Covers of the example issue on weekendfolio.com, in three of the six designs. -->
    <img src="https://weekendfolio.com/examples/feature/page-01.webp" alt="" />
    <img src="https://weekendfolio.com/examples/poster/page-01.webp" alt="" />
    <img src="https://weekendfolio.com/examples/folio/page-01.webp" alt="" />
  </div>
</div>
<div id="logo" class="mark"><span>w</span></div>
<div id="logo-dark" class="mark"><span>w</span></div>

<script>
  const shown = document.getElementById(location.hash.slice(1))
  if (shown) {
    shown.classList.add('shown')
    document.body.classList.add('one')
  }
</script>
