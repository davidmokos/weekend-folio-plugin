interface:
  display_name: "Weekend Folio issue"
  short_description: "Make an issue and get it as a PDF or on a Kindle"
  default_prompt: "Use $weekend-folio-issue to make an issue from my saved articles and send me the PDF."

dependencies:
  tools:
    - type: "mcp"
      value: "weekend-folio"
      description: "The reader's Weekend Folio library, issues and settings"
      transport: "streamable_http"
      url: "https://weekendfolio.com/mcp"
