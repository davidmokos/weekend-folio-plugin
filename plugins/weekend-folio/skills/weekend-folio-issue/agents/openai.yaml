interface:
  display_name: "Weekend Folio issue"
  short_description: "Get your next issue as a PDF or on a Kindle"
  default_prompt: "Use $weekend-folio-issue to send me the PDF of my next issue."

dependencies:
  tools:
    - type: "mcp"
      value: "weekend-folio"
      description: "The reader's Weekend Folio library, issues and settings"
      transport: "streamable_http"
      url: "https://weekendfolio.com/mcp"
